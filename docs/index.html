<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kampala Heat Atlas</title>
<meta name="description" content="How Kampala grew, where it is hottest, who lives in the heat, and what trees and rooftops could do about it.">
<!-- The atlas is the React app in web/ (built into app/); its data is in atlas/, written by scripts/14_atlas.py.
     Old links to a module (index.html#heat) land on the same module. -->
<meta http-equiv="refresh" content="0; url=app/#/atlas">
<script>location.replace("app/#/atlas" + (/^#[a-z0-9-]+$/.test(location.hash) ? "/" + location.hash.slice(1) : ""));</script>
<p style="font-family:Arial,sans-serif;padding:24px"><a href="app/#/atlas">Open the Kampala Heat Atlas</a></p>
