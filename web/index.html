<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kampala Heat Atlas</title>
    <meta name="description" content="How Kampala grew, where it is hottest, who lives in the heat, and daily site weather for construction across Africa and the Gulf.">
    <meta name="theme-color" content="#eceef0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
    <script>
      // apply a saved theme before the first paint, so dark mode does not flash light
      try { var t = localStorage.getItem("kha-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
